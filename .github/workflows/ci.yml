name: ci

on:
  pull_request:
  push:
    branches: [main]

# One shared CI database (the Neon `ci` branch): serialize runs so two test
# suites never truncate each other mid-flight.
concurrency:
  group: ci-database
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: alembic upgrade head
      - run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # build-time only; any valid-shaped key lets `next build` compile
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SLIDERULE_API_URL: http://localhost:8000
