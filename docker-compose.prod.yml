# Production: Caddy (auto-HTTPS) + API + worker on one host. Secrets come
# from .env.production (never committed). Migrations run once at deploy:
#   docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
services:
  caddy:
    image: caddy:2
    container_name: sliderule-caddy
    env_file: .env.production   # SLIDERULE_DOMAIN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  api:
    image: sliderule
    build: .
    container_name: sliderule-api
    env_file: .env.production
    expose:
      - "8000"
    restart: unless-stopped

  worker:
    image: sliderule
    build: .
    container_name: sliderule-worker
    command: ["python", "-m", "sliderule.worker"]
    env_file: .env.production
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
