[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sliderule"
version = "0.1.0"
description = "Sourcing pipeline for small licensed-profession firms: source, filter and contact part-time / contract engineers from public permit-filing data."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "psycopg[binary]",
    "alembic",
    "sqlalchemy",       # only for Alembic's engine; app queries use psycopg directly
    "pydantic",
    "pytest",
    "python-dotenv",
    "pyjwt[crypto]",    # Clerk JWT verification (RS256 via JWKS)
    "httpx",            # FastAPI TestClient; later the HTTP seam for adapters
    "uvicorn",
]

[tool.hatch.build.targets.wheel]
packages = ["sliderule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
